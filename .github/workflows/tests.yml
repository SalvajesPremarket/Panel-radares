name: TradeScanner CI

on:
  push:
    branches:
      - main
      - prepare/self-host-platform
  pull_request:
    branches:
      - main
      - prepare/self-host-platform

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r webapp/requirements.txt
          pip install pytest

      - name: Run TradeScanner data and bridge tests
        run: |
          PYTHONPATH=. pytest tests/test_data_engine.py tests/test_market_stream_symbols.py tests/test_bridge_history_before_stream.py tests/test_shared_stream_motor_bridge.py tests/test_signal_publisher.py -vv --tb=long

      - name: Test TradeBot Paper strategies
        run: |
          PYTHONPATH=. pytest tests/test_tradebot_paper.py tests/test_tradebot_runtime_controls.py tests/test_tradebot_pullback_corto.py -vv --tb=long

      - name: Test web app database initialization
        run: |
          PYTHONPATH=. pytest tests/test_webapp_startup.py -vv --tb=long

      - name: Run full repository test suite
        run: |
          PYTHONPATH=. pytest tests BotTradeScanner/pruebas -vv --tb=long

      - name: Smoke check active Streamlit entrypoint
        run: |
          python -m py_compile app.py

      - name: Validate and build self-hosted containers
        run: |
          bash -n deploy/self-host/backup-postgres.sh
          bash -n deploy/self-host/restore-postgres-test.sh
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml config -q
          docker run --rm -e WEB_DOMAIN=app.example.com -e SCANNER_DOMAIN=scanner.example.com -v "$PWD/deploy/self-host/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml build web scanner
