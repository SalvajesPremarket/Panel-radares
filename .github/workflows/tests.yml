name: TradeScanner CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run TradeScanner data engine tests
        run: |
          PYTHONPATH=. pytest tests/test_data_engine.py -vv --tb=long

      - name: Smoke check Streamlit entrypoints
        run: |
          python -m py_compile app.py BotTradeScanner/pruebas/pagina_prueba_motor.py
