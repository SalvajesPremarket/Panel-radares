name: one-time layout palette patch

on:
  push:
    paths:
      - ".github/workflows/ts-layout-palette-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch scanner palette
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path("app.py")
          s = app.read_text(encoding="utf-8")

          # Header: gear -> chain.
          s2 = s.replace("⚙️ Layout", "🔗 Layout", 1)
          if s2 == s:
              raise SystemExit("No se encontró el encabezado ⚙️ Layout")
          s = s2

          # Replace the browser native color picker with our broker-style palette button.
          old = "f"<input type='color' class='layout-color-picker' data-layout-color='{_layout_id}' title='Color de {_layout_id}' onchange='guardarColorLayout(&quot;{_layout_id}&quot;,this.value)'>""
          new = "f"<button type='button' class='layout-color-picker' data-layout-color='{_layout_id}' title='Color de {_layout_id}' onclick='abrirPaletaLayout(event,&quot;{_layout_id}&quot;)'></button>""
          count = s.count(old)
          if count < 1:
              raise SystemExit(f"No se encontró el selector de color principal (count={count})")
          s = s.replace(old, new)

          # Empty rows use the same palette button.
          old2 = "f"<input type='color' class='layout-color-picker' data-layout-color='L{indice}' title='Color de L{indice}' onchange='guardarColorLayout(&quot;L{indice}&quot;,this.value)'>""
          new2 = "f"<button type='button' class='layout-color-picker' data-layout-color='L{indice}' title='Color de L{indice}' onclick='abrirPaletaLayout(event,&quot;L{indice}&quot;)'></button>""
          count2 = s.count(old2)
          if count2 < 1:
              raise SystemExit(f"No se encontró el selector de color de fila vacía (count={count2})")
          s = s.replace(old2, new2)

          # Broker-style palette: the nine link colors shown by thinkorswim,
          # plus a tenth distinct cyan slot so the scanner can keep L1-L10.
          marker_css = '    h += ".schwab-item{grid-column:span 2;align-items:center;}.schwab-item label{flex:0 0 auto;}.schwab-item>span{flex:1 1 auto;min-width:0;text-align:left;}.schwab-item button{white-space:nowrap;}";'
          css = '''    h += ".layout-color-picker{position:relative;display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;padding:0;border:2px solid #777;border-radius:4px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}";
          h += ".layout-color-picker:hover{filter:brightness(1.15);transform:scale(1.04)}";
          h += ".layout-palette{position:fixed;display:none;z-index:100000;background:#20242a;border:1px solid #6b737d;border-radius:5px;padding:5px;box-shadow:0 8px 24px rgba(0,0,0,.55);width:178px;}";
          h += ".layout-palette.open{display:grid;grid-template-columns:1fr 1fr;gap:3px;}";
          h += ".layout-palette button{height:28px;display:flex;align-items:center;gap:6px;padding:2px 5px;background:#2b3038;border:1px solid #4a515b;color:#eef2f6;font-size:9px;font-weight:700;text-align:left;cursor:pointer;}";
          h += ".layout-palette button:hover{background:#3a414b;border-color:#8b949e;}";
          h += ".layout-palette .swatch{width:18px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.5);flex:0 0 auto;}";
          h += ".layout-palette .num{width:13px;text-align:center;color:#d7dce2;font-size:9px;}";
          h += "@media(max-width:520px){.layout-palette{width:170px;}}";
'''
          if marker_css not in s:
              raise SystemExit("No se encontró el bloque CSS Schwab para insertar la paleta")
          s = s.replace(marker_css, css + marker_css, 1)

          # Add palette JS before cambiarLayout.
          marker_js = '    h += "function cambiarLayout(t,e){'
          js = '''    h += """var TS_LAYOUT_LINK_COLORS=[
            {n:1,name:'Red',c:'#d51f1f'},
            {n:2,name:'Yellow',c:'#f1cf16'},
            {n:3,name:'Blue',c:'#178fca'},
            {n:4,name:'Green',c:'#159447'},
            {n:5,name:'Purple',c:'#9a4de3'},
            {n:6,name:'Maroon',c:'#8b2f18'},
            {n:7,name:'Orange',c:'#d86b08'},
            {n:8,name:'Brown',c:'#8b5a2b'},
            {n:9,name:'Lilac',c:'#b56bd9'},
            {n:10,name:'Cyan',c:'#11a9b5'}
          ];
          function _layoutColorsLoad(){var o={};try{o=JSON.parse(localStorage.getItem('tsLayoutColors_'+TS_USER_KEY)||'{}')||{}}catch(e){}return o;}
          function _layoutColorsSave(o){try{localStorage.setItem('tsLayoutColors_'+TS_USER_KEY,JSON.stringify(o))}catch(e){}try{window.top.localStorage.setItem('tsLayoutColors_'+TS_USER_KEY,JSON.stringify(o))}catch(e){}}
          function _layoutColor(layout){var o=_layoutColorsLoad();if(o[layout])return o[layout];var x=TS_LAYOUT_LINK_COLORS.find(function(v){return 'L'+v.n===layout});return x?x.c:'#d51f1f';}
          function guardarColorLayout(layout,color){var o=_layoutColorsLoad();o[String(layout)]=String(color);_layoutColorsSave(o);aplicarColoresLayouts();}
          function aplicarColoresLayouts(){document.querySelectorAll('[data-layout-color]').forEach(function(el){var l=el.getAttribute('data-layout-color');var c=_layoutColor(l);el.style.background=c;el.setAttribute('data-current-color',c);});}
          function cerrarPaletaLayout(){var p=document.getElementById('layout-palette');if(p){p.classList.remove('open');p.style.display='none';}}
          function seleccionarColorLayout(layout,color){guardarColorLayout(layout,color);cerrarPaletaLayout();}
          function abrirPaletaLayout(ev,layout){
            try{ev.preventDefault();ev.stopPropagation();}catch(e){}
            var old=document.getElementById('layout-palette');if(old)old.remove();
            var p=document.createElement('div');p.id='layout-palette';p.className='layout-palette open';
            TS_LAYOUT_LINK_COLORS.forEach(function(v){
              var b=document.createElement('button');b.type='button';b.title=v.n+' · '+v.name;
              b.innerHTML='<span class="num">'+v.n+'</span><span class="swatch" style="background:'+v.c+'"></span><span>'+v.name+'</span>';
              b.onclick=function(e){e.preventDefault();e.stopPropagation();seleccionarColorLayout(layout,v.c);};
              p.appendChild(b);
            });
            document.body.appendChild(p);
            var r=ev.currentTarget.getBoundingClientRect();
            var left=Math.min(Math.max(6,r.left),window.innerWidth-184);
            var top=r.bottom+4;
            if(top+180>window.innerHeight)top=Math.max(6,r.top-184);
            p.style.left=left+'px';p.style.top=top+'px';p.style.display='grid';
          }
          document.addEventListener('click',function(e){var p=document.getElementById('layout-palette');if(p&&!p.contains(e.target)&&!e.target.closest('.layout-color-picker'))cerrarPaletaLayout();});
          document.addEventListener('DOMContentLoaded',function(){setTimeout(aplicarColoresLayouts,80);});
"""
'''
          if marker_js not in s:
              raise SystemExit("No se encontró function cambiarLayout para insertar JS")
          s = s.replace(marker_js, js + marker_js, 1)

          app.write_text(s, encoding="utf-8")

          # Align the bridge fallback colors with the same broker palette.
          bridge = Path("panel_radar_bridge.py")
          if bridge.exists():
              b = bridge.read_text(encoding="utf-8")
              pattern = re.compile(r"DEFAULT_LAYOUT_COLORS\s*=\s*\{.*?\n\}", re.S)
              replacement = '''DEFAULT_LAYOUT_COLORS = {
              "L1": "#d51f1f",
              "L2": "#f1cf16",
              "L3": "#178fca",
              "L4": "#159447",
              "L5": "#9a4de3",
              "L6": "#8b2f18",
              "L7": "#d86b08",
              "L8": "#8b5a2b",
              "L9": "#b56bd9",
              "L10": "#11a9b5",
          }'''
              b2, n = pattern.subn(replacement, b, count=1)
              if n:
                  bridge.write_text(b2, encoding="utf-8")

          # Syntax check before committing.
          import py_compile
          py_compile.compile("app.py", doraise=True)

          # Remove this one-time workflow so it leaves no permanent helper file.
          Path(".github/workflows/ts-layout-palette-once.yml").unlink()

      - name: Commit final change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py panel_radar_bridge.py .github/workflows/ts-layout-palette-once.yml
          git commit -m "Cambia selector de Layout por paleta de enlaces del broker"
          git push
