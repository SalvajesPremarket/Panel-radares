name: tradescanner

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile.web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TRADESCANNER_SESSION_SECRET: ${TRADESCANNER_SESSION_SECRET:?Set TRADESCANNER_SESSION_SECRET in .env}
      TRADESCANNER_SIGNAL_INGEST_SECRET: ${TRADESCANNER_SIGNAL_INGEST_SECRET:?Set TRADESCANNER_SIGNAL_INGEST_SECRET in .env}
      TRADESCANNER_SCANNER_URL: https://${SCANNER_DOMAIN:?Set SCANNER_DOMAIN in .env}
      TRADESCANNER_TRADEBOT_AUTO_PAPER: "false"
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  scanner:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile.scanner
    restart: unless-stopped
    environment:
      TRADESCANNER_SIGNAL_INGEST_URL: https://${WEB_DOMAIN:?Set WEB_DOMAIN in .env}/api/v1/signals/ingest
      TRADESCANNER_SIGNAL_INGEST_SECRET: ${TRADESCANNER_SIGNAL_INGEST_SECRET:?Set TRADESCANNER_SIGNAL_INGEST_SECRET in .env}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      SCANNER_DOMAIN: ${SCANNER_DOMAIN:?Set SCANNER_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - scanner
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
