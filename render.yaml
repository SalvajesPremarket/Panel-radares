services:
  - type: web
    name: tradescanner-webapp
    runtime: python
    rootDir: webapp
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TRADESCANNER_SESSION_SECRET
        generateValue: true
      - key: TRADESCANNER_SCANNER_URL
        value: https://jd6gih.streamlit.app
