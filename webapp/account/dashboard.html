<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeScanner — Dashboard</title>
<style>
body{margin:0;background:#07111f;color:#eef4ff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,92vw);margin:32px auto}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#9fb0c6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:24px 0}.card{background:#0d1b2d;border:1px solid #20344e;border-radius:16px;padding:20px}.value{font-size:22px;font-weight:750;margin-top:8px}button{padding:10px 14px;border:1px solid #30455f;border-radius:9px;background:#12243a;color:white;cursor:pointer}.ok{color:#7ee2ae}.bad{color:#ff9d9d}a{color:#8bb5ff;text-decoration:none}
</style></head><body><main class="wrap">
<div class="top"><div><a href="/">TradeScanner</a><h1>Dashboard</h1><div class="muted" id="welcome"></div></div><button id="logout">Cerrar sesión</button></div>
<div class="grid" id="cards"></div>
<div class="card"><h2>Servicios</h2><div id="services" class="muted">Comprobando acceso…</div><p style="margin-top:16px"><a href="/scanner">Abrir Scanner privado →</a></p></div>
</main>
<script>
async function get(url){return fetch(url,{credentials:'include'});}
async function load(){
 const me=await get('/auth/me'); if(!me.ok){location.href='/login';return;}
 const u=await me.json(); document.querySelector('#welcome').textContent='Sesión activa · '+(u.display_name||u.email);
 const cards=[['Cuenta',u.account_status],['Trial hasta',new Date(u.trial_ends_at).toLocaleDateString('es')],['Plan',u.subscription_plan||'Trial'],['Suscripción',u.subscription_status||'Sin suscripción']];
 document.querySelector('#cards').innerHTML=cards.map(x=>'<article class="card"><div class="muted">'+x[0]+'</div><div class="value">'+x[1]+'</div></article>').join('');
 const a=await get('/account/access'); const access=await a.json();
 if(!a.ok){document.querySelector('#services').innerHTML='<span class="bad">No autorizado</span>';return;}
 document.querySelector('#services').innerHTML=[
  'Scanner: '+(access.scanner?'✓ disponible':'✕ bloqueado'),
  'Signals API: '+(access.signals_api?'✓ disponible':'✕ bloqueada'),
  'Bot: '+(access.bot?'✓ disponible':'✕ bloqueado')
 ].join(' · ');
}
document.querySelector('#logout').onclick=async()=>{await fetch('/auth/logout',{method:'POST',credentials:'include'});location.href='/';};load();
</script></body></html>
