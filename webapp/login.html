<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeScanner — Iniciar sesión</title>
<style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eef4ff;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90vw);background:#0d1b2d;border:1px solid #20344e;border-radius:18px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}p{color:#9fb0c6}label{display:block;margin:16px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #30455f;background:#091525;color:white}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#4f8cff;color:white;font-weight:700;cursor:pointer}.msg{min-height:22px;margin-top:14px;color:#ff9d9d}a{color:#8bb5ff}</style></head>
<body><main class="card"><a href="/">← TradeScanner</a><h1>Iniciar sesión</h1><p>Accede a tu cuenta y continúa con tu scanner.</p>
<form id="login"><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"><button>Entrar</button><div class="msg" id="msg"></div></form><p>¿No tienes cuenta? <a href="/register">Prueba 1 mes</a></p></main>
<script>const f=document.querySelector('#login'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json().catch(()=>({}));if(r.ok)location.href='/account';else m.textContent=d.detail||'No se pudo iniciar sesión.'};</script></body></html>
